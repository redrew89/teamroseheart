name: Update Live Stream

on:
  schedule:
    - cron: '*/10 * * * *'   # auto-check every 10 minutes
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check'
        type: choice
        options:
        - check
        - go_live
        - go_offline

jobs:
  update-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check or update live status
        run: node .github/scripts/update-live.js
        env:
          ACTION: ${{ inputs.action || 'check' }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add live/stream.json
          if git commit -m "Update live stream status"; then
            git push
          else
            echo "No changes to commit"
          fi
